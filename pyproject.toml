[project]
name = "jrfd4-proteina"
version = "0.1.0"
description = "JAX/Equinox port of RFD4-Proteina inference: flow network, sampler and autoencoder"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "nboyd", email = "nickboyd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8",
    "equinox>=0.13.1",
    "jax>=0.10",
    "jaxtyping>=0.2.36",
    "numpy>=2.1",
]

[project.optional-dependencies]
convert = [
    "rfd4-proteina>=0.0.3",
    "safetensors>=0.8.0",
    "torch>=2.11",
]
cuda = [
    "jax[cuda12]>=0.12.0.1",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "beartype>=0.23.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["reference: parity against the PyTorch reference (needs the `convert` extra and the HF checkpoint)"]
addopts = "-m 'not reference'"

[tool.ruff]
line-length = 120
