# The reference's "Design a binder in 10 lines" example (docs/how-to/binder-in-10-lines.md):
# a de novo 50-120 residue binder against PD-L1 (5O45 chain A, residues 17-131), given the target's
# backbone internal geometry (free pose), its sequence, and three hotspot side chains.
pdl1_binder:
  input: 5o45_cropped.cif.zst
  contig: "50-120, /0, A17-131"
  conditions:
    C_CRDGRP: {1: [{select: "sel('A/*/*/[N,CA,C,O]')"}]}
    C_SEQ: {true: [{select: "sel('A')"}]}
    C_HOT: {true: [{select: "sel('A/*/56/[CG,OH]')"}, {select: "sel('A/*/115/[CG,SD]')"}, {select: "sel('A/*/123/[CD2,OH]')"}]}
